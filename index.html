<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury E-Commerce Admin Dashboard</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-glow: rgba(212, 175, 55, 0.4);
            --primary-gold: #d4af37;
            --accent-gold: #f3e5ab;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --input-bg: rgba(31, 41, 55, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            padding: 30px 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Navigation Buttons Panel */
        .nav-buttons-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #1f2937, #111827);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-btn:hover {
            border-color: var(--primary-gold);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.25), inset 0 1px 2px rgba(212, 175, 55, 0.3);
            color: var(--accent-gold);
        }

        /* Highlighted Center Button (Retail) */
        .nav-btn.center-primary {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #0b0f19;
            border: 1px solid #fff;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }
        .nav-btn.center-primary:hover {
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
            color: #000;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.6);
        }

        /* Main Form Card with Luxury Glassmorphism & Glossy Borders */
        .luxury-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
        }

        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-gold);
            background: rgba(31, 41, 55, 0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* Action Buttons */
        .actions-container {
            margin-top: 35px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-gold), #aa7c11);
            color: #0b0f19;
            font-weight: 700;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        /* Toast Notification Styling */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--primary-gold);
            color: var(--text-main);
            padding: 16px 25px;
            border-radius: 12px;
            box-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.35);
        }
        #toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        #toast-notification i {
            color: var(--primary-gold);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header -->
        <div class="header">
            <h1>Executive Product Management</h1>
            <p>Maintain pristine catalog novelty with luxury backend controls</p>
        </div>

        <!-- Navigation Buttons Panel (Requested Layout) -->
        <div class="nav-buttons-panel">
            <!-- Left Side: Wholesale (W) -->
            <a href="w.html" class="nav-btn" title="Wholesale Add Product">
                <i class="fa-solid fa-boxes-stacked"></i> Wholesale Add Product (W)
            </a>

            <!-- Center: Retail (R) - Prominent -->
            <a href="r.html" class="nav-btn center-primary" title="Retail Add Product">
                <i class="fa-solid fa-store"></i> Retail Add Product (R)
            </a>

            <!-- Right Side: Live (L) -->
            <a href="l.html" class="nav-btn" title="Live Add Product">
                <i class="fa-solid fa-broadcast-tower"></i> Live Add Product (L)
            </a>
        </div>

        <!-- Main Product Entry / Edit Dashboard Card -->
        <div class="luxury-card">
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <div class="form-grid">
                    
                    <!-- Product Identification -->
                    <div class="form-group">
                        <label for="prodName">Product Name</label>
                        <input type="text" id="prodName" placeholder="Enter luxury product name" required>
                    </div>

                    <div class="form-group">
                        <label for="prodCategory">Store Location / Category</label>
                        <select id="prodCategory">
                            <option value="store">Store Repository</option>
                            <option value="mystore">My Store Showcase</option>
                        </select>
                    </div>

                    <!-- Pricing & Financials -->
                    <div class="form-group">
                        <label for="basePrice">Base Price ($)</label>
                        <input type="number" id="basePrice" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="intlDiscount">International Discount (%)</label>
                        <input type="number" id="intlDiscount" placeholder="Global markdown %" step="0.1">
                    </div>

                    <div class="form-group">
                        <label for="localDiscount">Local Discount (%)</label>
                        <input type="number" id="localDiscount" placeholder="Domestic markdown %" step="0.1">
                    </div>

                    <!-- Inventory & Stock -->
                    <div class="form-group">
                        <label for="stockLevel">Stock Level</label>
                        <input type="number" id="stockLevel" placeholder="Available units" required>
                    </div>

                    <!-- Custom Specifications -->
                    <div class="form-group">
                        <label for="customSize">Custom Sizes / Attributes</label>
                        <input type="text" id="customSize" placeholder="e.g., Golden Teak, Premium Finish">
                    </div>

                    <div class="form-group">
                        <label for="adminNotes">Admin / Customer Notes</label>
                        <input type="text" id="adminNotes" placeholder="Special care or handling notes">
                    </div>

                    <!-- Detailed Description -->
                    <div class="form-group full-width">
                        <label for="prodDetails">Product Details & Description</label>
                        <textarea id="prodDetails" rows="4" placeholder="Craft a high-end luxury description..."></textarea>
                    </div>

                </div>

                <!-- Actions -->
                <div class="actions-container">
                    <button type="button" class="nav-btn" onclick="triggerEditMode()" style="padding: 14px 25px;">
                        <i class="fa-solid fa-pen-to-square"></i> Edit Existing
                    </button>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Publish New Product
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- Luxury English Notification Toast -->
    <div id="toast-notification">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Action executed successfully!</span>
    </div>

    <script>
        function showNotification(message) {
            const toast = document.getElementById('toast-notification');
            const msgSpan = document.getElementById('toast-message');
            msgSpan.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            // Simulating successful upload ensuring freshness & newness
            showNotification('Success: New trending product uploaded and synchronized!');
            document.getElementById('productForm').reset();
        }

        function triggerEditMode() {
            showNotification('Edit Mode Activated: Modify parameters instantly.');
        }
    </script>
</body>
</html>
